};
V.games=function(){return hdr('Games','','<button class="ibtn back" data-go="more">'+ic("back",26)+'</button>')+'<div class="grid">'+tile("games","help","c-green","Quick-fire","10 questions")+tile("games","list","c-blue","In order","DNS, DHCP, TLS")+tile("games","chart","c-amber","Subnet sprint","60 seconds")+tile("games","tools","c-purple","Port match","60 seconds")+'</div>'};
V.live=function(){return hdr('Live','','<button class="ibtn back" data-go="more">'+ic("back",26)+'</button>')+'<div class="card"><h2>Canadian dollar</h2><div class="row"><div class="tx"><b>US dollar</b></div><b>1.3912</b></div><div class="row"><div class="tx"><b>Euro</b></div><b>1.6101</b></div></div><div class="card"><h2>NHL today</h2><div class="row"><div class="tx"><b>OTT 2 @ TOR 3</b></div><span class="badge">P3 04:12</span></div></div>'};
V.lockf=function(){return hdr('Lock files','.adeebo · offline','<button class="ibtn back" data-go="more">'+ic("back",26)+'</button>')+'<div class="card"><button class="btn" style="margin-bottom:10px">Open a .adeebo file</button><button class="btn ghost">Lock a file</button></div>'};

function wide(){return matchMedia("(min-width:768px)").matches}
var TABS=[["home","home","Home"],["devices","wifi","Devices"],["pc","pc","PC"],["tools","tools","Tools"],["more","more","More"]];
var TABOF={settings:"more",companion:"more",how:"more",learn:"more",games:"more",live:"more",lockf:"more",pair:"home",walk:"home",send:"pc"};
function draw(){
  document.documentElement.setAttribute("data-theme",S.theme==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):S.theme);
  document.documentElement.setAttribute("data-contrast",S.hc?"high":"");
  $("app").innerHTML=V[S.tab]();
  var cur=TABOF[S.tab]||S.tab;
  $("tabs").innerHTML='<div class="brand">'+face("happy",34)+'AdeeboMeter</div>'+TABS.map(function(t){return '<button data-go="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+ic(t[1],24)+t[2]+'</button>'}).join("");
  [].forEach.call(document.querySelectorAll("select[data-sel]"),function(s){s.value=S[s.getAttribute("data-sel")]});
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go],[data-dev],[data-pct],[data-mode],[data-tog],[data-pcs]");if(!b)return;
  var g=b.getAttribute("data-go");if(g){if(g==="devices")S.dev=null;if(g==="pc"&&S.tab!=="pc")S.pcTab="overview";S.tab=g;draw();scrollTo(0,0);return}
  var d=b.getAttribute("data-dev");if(d!=null){S.dev=+d<0?null:+d;draw();scrollTo(0,0);return}
  var p=b.getAttribute("data-pct");if(p){S.pcTab=p;draw();return}
  var m=b.getAttribute("data-mode");if(m){S.mode=m;draw();return}
  var t=b.getAttribute("data-tog");if(t&&!b.disabled){S[t]=!S[t];if(t==="remember"&&!S.remember)S.bio=false;draw();return}
  var s=b.getAttribute("data-pcs");if(s){S.pc=s;if(S.tab==="pair")S.tab="home";draw();return}
});
document.addEventListener("change",function(e){var k=e.target.getAttribute("data-sel");if(k){S[k]=e.target.value;draw()}});
draw();
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(draw,120)});
})();
</script>
</body>
</html>
