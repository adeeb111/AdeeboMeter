name = "adeebometer-remote"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

# a room is a Durable Object held in memory only - no storage is written except the room's close-alarm time
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# bug-hunt ML-126: one count per address across all of Cloudflare (the in-memory count is per machine). 20 rooms a
# minute is far above a person (a phone 20, a PC 6 are the in-memory limits) and far below a flood.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
