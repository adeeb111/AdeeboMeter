# bug-hunt ML-120: the relay's deploy settings, kept with its code like tools/live and tools/remote.
# Secrets are never here - set them with:  npx wrangler secret put GITHUB_TOKEN  /  npx wrangler secret put TURNSTILE_SECRET
name = "adeebometer-relay"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

# RL: the per-address counts (5 an hour, 20 a day). Paste the id of the namespace the relay already uses
# (Cloudflare > Storage & Databases > KV), or make one with:  npx wrangler kv namespace create RL
[[kv_namespaces]]
binding = "RL"
id = "PASTE-THE-RL-NAMESPACE-ID"

# LIMITER: Cloudflare's atomic rate limit - it decides before the KV counts, which two requests at once can both pass
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
