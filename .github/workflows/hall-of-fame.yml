# The Hall of Fame: checks an Adeebo Award card's claim code and, on a match, adds it to docs/hall-of-fame.json
# (the website shows that file). Two ways in:
#   - the "Join the Hall of Fame" issue form: runs by itself, comments the result, closes the issue
#   - a card that came by email: Actions > hall-of-fame > Run workflow, and type what's on the card
# The key is the HOF_KEY repository secret - the same one the official build puts in AdeeboMeter.
# Nothing from the issue is ever pasted into a shell line: it reaches the script as environment variables.
name: hall-of-fame
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      name:     { description: "Name on the card", required: true }
      points:   { description: "Points on the card", required: true }
      date:     { description: "Date on the card (2026-11-12)", required: true }
      code:     { description: "Claim code (ADB-XXXX-XXXX-XXXX-XXXX)", required: true }
      where:    { description: "Where people can find them (optional): github, linkedin, x, instagram or bluesky", required: false }
      handle:   { description: "Their handle on that site (optional)", required: false }
permissions:
  contents: read
# No concurrency group: GitHub keeps only one waiting run per group and silently cancels the rest. Two cards at once
# are handled by pushing with a rebase and retrying instead.
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'hall-of-fame'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to add the entry
      issues: write     # to comment and close
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
      - name: Check the claim code
        id: v
        continue-on-error: true
        env:
          HOF_KEY: ${{ secrets.HOF_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          IN_NAME: ${{ github.event.inputs.name }}
          IN_POINTS: ${{ github.event.inputs.points }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_CODE: ${{ github.event.inputs.code }}
          IN_WHERE: ${{ github.event.inputs.where }}
          IN_HANDLE: ${{ github.event.inputs.handle }}
        run: python3 .github/scripts/hof_verify.py
      - name: Add it to the page
        id: add
        if: steps.v.outputs.result == 'added'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hall-of-fame.json
          git commit -m "Hall of Fame: a new Adeebo Award"
          # the claim code this run added - after any retry, success means it is really in the pushed file
          # the entry this run added: the one in the new file that wasn't in the old (the list is sorted by date, so not "the last")
          git show HEAD~1:docs/hall-of-fame.json > /tmp/hof-old.json
          CODE=$(python3 -c "import json; o={x['code'] for x in json.load(open('/tmp/hof-old.json'))['entries']}; print([x for x in json.load(open('docs/hall-of-fame.json'))['entries'] if x['code'] not in o][0]['code'])")
          NAME=$(python3 -c "import json; o={x['code'] for x in json.load(open('/tmp/hof-old.json'))['entries']}; print([x for x in json.load(open('docs/hall-of-fame.json'))['entries'] if x['code'] not in o][0]['name'])")
          # someone else's card (or Adeeb) may have pushed meanwhile: take theirs and put ours on top, a few times
          for i in 1 2 3 4 5; do
            if git push; then
              # the entry with this code must carry this claimant's name - a code someone else already claimed isn't "added"
              if CODE="$CODE" NAME="$NAME" python3 -c "import json,os,sys; e=json.load(open('docs/hall-of-fame.json'))['entries']; sys.exit(0 if any(x.get('code')==os.environ['CODE'] and x.get('name')==os.environ['NAME'] for x in e) else 1)"; then exit 0; fi
              echo "Pushed, but the entry isn't in the file (the issue changed meanwhile)"; exit 1
            fi
            sleep $((i * 3))
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; python3 .github/scripts/hof_verify.py > /dev/null || true; git add docs/hall-of-fame.json; git commit -m "Hall of Fame: a new Adeebo Award" || true; }
          done
          echo "Couldn't push the entry after 5 tries"; exit 1
        env:
          HOF_KEY: ${{ secrets.HOF_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          IN_NAME: ${{ github.event.inputs.name }}
          IN_POINTS: ${{ github.event.inputs.points }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_CODE: ${{ github.event.inputs.code }}
          IN_WHERE: ${{ github.event.inputs.where }}
          IN_HANDLE: ${{ github.event.inputs.handle }}
      - name: Save a changed link
        id: change
        if: steps.v.outputs.result == 'updated' || steps.v.outputs.result == 'review'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hall-of-fame.json
          git commit -m "Hall of Fame: a link changed" || exit 0
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 3))
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; python3 .github/scripts/hof_verify.py > /dev/null || true; git add docs/hall-of-fame.json; git commit -m "Hall of Fame: a link changed" || true; }
          done
          echo "Couldn't push the change after 5 tries"; exit 1
        env:
          HOF_KEY: ${{ secrets.HOF_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          IN_NAME: ${{ github.event.inputs.name }}
          IN_POINTS: ${{ github.event.inputs.points }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_CODE: ${{ github.event.inputs.code }}
          IN_WHERE: ${{ github.event.inputs.where }}
          IN_HANDLE: ${{ github.event.inputs.handle }}
      - name: Answer on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.v.outputs.result }}
          MESSAGE: ${{ steps.v.outputs.message }}
          PUSHED: ${{ steps.add.outcome }}
        run: |
          if [ "$RESULT" = "added" ] && [ "$PUSHED" != "success" ]; then
            gh issue comment "$NUM" --body "Your card checked out, but saving it failed this time. Edit the issue (any small change) and it runs again."
          elif [ "$RESULT" = "added" ] || [ "$RESULT" = "already" ] || [ "$RESULT" = "updated" ]; then
            gh issue comment "$NUM" --body "$MESSAGE"
            gh issue close "$NUM" --reason completed
          elif [ "$RESULT" = "review" ]; then
            gh issue comment "$NUM" --body "$MESSAGE"
            gh issue edit "$NUM" --add-label "needs review"
          elif [ -z "$RESULT" ]; then
            gh issue comment "$NUM" --body "The check itself failed on our side - nothing is wrong with your card as far as we know. Adeeb has been told; edit the issue later and it runs again."
            gh issue edit "$NUM" --add-label "needs review"
          else
            gh issue comment "$NUM" --body "$MESSAGE (Edit the issue to fix it - the check runs again by itself.)"
            gh issue edit "$NUM" --add-label "not verified"
          fi
