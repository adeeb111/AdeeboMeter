# Builds AdeeboMeter on a clean Windows machine with Microsoft's own .NET Framework compiler, straight from this
# repository's source. One generated file is added: the Hall of Fame key (obj/HofKey.cs, from the HOF_KEY secret), so a rebuild
# from the source alone differs from the release in those bytes; the build provenance (gh attestation verify) still proves
# which workflow run and commit made each file.
#   push to main or dev-* -> AdeeboMeter.exe on its own (one click, one file) plus the packaged zips, as workflow artifacts
#   publish a release   -> the same files attached to that release (tag it v<version>, e.g. v1.0)
#   run it by hand on main with a tag -> rebuilds that release's files from main and refreshes its notes
name: build
on:
  push:
    branches: [main, store, "dev-*"]   # store: the Microsoft Store package before its release; dev-*: the version being worked on
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild and refresh an existing release (e.g. v1.0) - leave empty for a plain build"
        required: false
# Every action is pinned to an exact commit (a tag can be moved; a commit can't). Update them on purpose, never automatically.
# Two jobs: the build only reads the repository; the release job - which runs only for a release - is the only one that can
# write to it, sign provenance and attach files, and it never runs the build script.
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
          # a manual release run builds the tag it publishes - never whatever branch the run was started from
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
      - name: Source checks (swallowed code, site scripts parse, phone and PC agree)
        shell: pwsh
        run: python tools/ci_checks.py
      - name: Build and package (release.ps1)
        shell: pwsh
        # the one secret the build sees: the Hall of Fame key, so official award cards carry a claim code (see src/HallOfFame.cs).
        # It goes into one generated file (obj/HofKey.cs) that release.ps1 deletes after compiling; every other byte is this source.
        # Only a release (or a by-hand rebuild of a tagged release) gets it: a push build is an "unofficial build" whose cards carry no code.
        env:
          HOF_KEY: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')) && secrets.HOF_KEY || '' }}
        run: ./release.ps1
      - name: Self-test - nothing is uploaded or released if it fails
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./AdeeboMeter.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path AdeeboMeter-selftest.txt) { Get-Content AdeeboMeter-selftest.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
      # hunt-5: a release also gets the deep test (every tool with hostile input, leaks, the penny rule) - a failure stops it;
      # a run the time cap cuts short is reported as a warning, not a pass
      - name: Deep test (releases only)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: pwsh
        timeout-minutes: 60
        run: |
          $p = Start-Process -FilePath ./AdeeboMeter.exe -ArgumentList '--deeptest','--minutes','45' -PassThru
          if (-not $p.WaitForExit(55 * 60 * 1000)) { $p.Kill(); throw "deep test still running after 55 minutes" }
          $t = if (Test-Path AdeeboMeter-deeptest.txt) { Get-Content AdeeboMeter-deeptest.txt -Raw } else { "" }
          $t
          if ($t -eq "") { throw "deep test wrote no report (exit $($p.ExitCode)) - it may have crashed" }
          if ($t -match ' FAILED') { throw "deep test failed" }
          if ($p.ExitCode -ne 0 -and $t -notmatch 'INCOMPLETE') { throw "deep test exited $($p.ExitCode)" }
          if ($t -notmatch 'ALL PASSED') { Write-Output "::warning::deep test didn't finish inside its cap - see the report above" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: AdeeboMeter
          path: dist/*
      # The same AdeeboMeter.exe on its own, not zipped: the one-click, one-file download for testers (Actions > the run >
      # Artifacts > AdeeboMeter.exe). archive: false needs upload-artifact v7 and exactly one file; the file name is the artifact's name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          path: dist/AdeeboMeter.exe
          archive: false
      # The Microsoft Store package (unsigned - Microsoft signs it after review). Never attached to the GitHub release;
      # download it from the run's Artifacts and upload it in Partner Center. A packaging problem doesn't hold up the release.
      - name: Store package (store/pack.ps1)
        id: store
        continue-on-error: true
        shell: pwsh
        run: ./store/pack.ps1 -Exe ./AdeeboMeter.exe
      - if: steps.store.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: AdeeboMeter-store
          path: store/out/*.msixbundle
  release:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write       # build provenance: proves these files came from this workflow, in this repository
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: AdeeboMeter
          path: dist
      - name: "Build provenance - check a file with: gh attestation verify <file> -R adeeb111/AdeeboMeter"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}   # passed as data, never pasted into the script
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v[0-9]+(\.[0-9]+){1,3}$') { throw "not a release tag: $tag" }
          $ver = $tag.TrimStart("v")
          if (-not (Test-Path "dist/RELEASE-NOTES-$ver.md")) { throw "tag $tag does not match the version in AdeeboMeter.cs" }
          # code signing (from 1.1.5): the files are built here into a draft release, the author signs the exe on his PC
          # (the key is unlocked from his phone, so it can't happen here) and puts the signed files on the draft, then
          # publishes it. Publishing runs this workflow again - it must not put the unsigned files back over the signed ones.
          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $have = gh release view $tag --json assets --jq '.assets[].name'
            if ($have -contains "AdeeboMeter.exe") { Write-Host "The release already has its files (signed by hand) - leaving them as they are."; exit 0 }
          }
          gh release upload $tag (Get-ChildItem dist -File | Where-Object Name -notlike "RELEASE-NOTES-*").FullName --clobber
          gh release edit $tag --title "AdeeboMeter $ver" --notes-file "dist/RELEASE-NOTES-$ver.md"
