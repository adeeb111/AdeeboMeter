<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>
<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
<alias binding="same"><family>Segoe UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
<alias binding="same"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
<alias binding="same"><family>Cascadia Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
<alias binding="same"><family>Georgia</family><prefer><family>DejaVu Serif</family></prefer></alias>
<alias binding="same"><family>Nirmala UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
