<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AdeeboMeter Result</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- The result arrives in the link after the # - browsers never send that part to the server, so adeebometer.com never sees it.
     Everything below is worked out here, on the phone. Format (v1): see src/Ui/FullView.Share.cs, QrLink(). -->
<style>
:root{--blue:#1F6FEB;--blue-s:#E8F0FE;--green:#2DA44E;--green-s:#E6F4EA;--amber:#BF8700;--amber-s:#FFF4D6;--red:#CF222E;--red-s:#FDE7E9;--purple:#8250DF;--ink:#1B2330;--sub:#4A5568;--muted:#6B7685;--line:#E3E8EF;--bg:#F6F8FB;--card:#fff;--grey-s:#EEF1F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue-s:#16233A;--green-s:#132A1B;--amber-s:#2E2410;--red-s:#3A1519;--ink:#E6EAF0;--sub:#B4BDC9;--muted:#8A94A3;--line:#2A3340;--bg:#0E131A;--card:#161C25;--grey-s:#1F2630}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 12px}.brand img{width:22px;height:22px}.brand small{font-weight:400;color:var(--muted);margin-left:auto;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.verdict{border-left:6px solid var(--muted)}.verdict h1{font-size:22px;line-height:1.25;margin:4px 0 6px}.verdict p{margin:0;color:var(--sub)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px}
.l0{--c:var(--green);--s:var(--green-s)}.l1{--c:var(--amber);--s:var(--amber-s)}.l2{--c:var(--red);--s:var(--red-s)}.l3{--c:var(--muted);--s:var(--grey-s)}
.verdict.l0,.verdict.l1,.verdict.l2{border-left-color:var(--c)}.tag{background:var(--s);color:var(--c)}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.path{display:flex;align-items:flex-start;gap:0}.leg{flex:1;text-align:center;font-size:13px;position:relative}
.leg .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:var(--s);border:3px solid var(--c)}
.leg:not(:last-child):after{content:"";position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);height:3px;background:var(--line)}
.leg b{display:block}.leg span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.num{background:var(--s,var(--grey-s));border-radius:12px;padding:10px 12px}
.num .k{font-size:12px;color:var(--sub)}.num .v{font-size:20px;font-weight:700}.num .w{font-size:12px;color:var(--c,var(--muted))}
svg{display:block;width:100%;height:auto}.cap{font-size:12px;color:var(--muted);margin-top:6px}
ol{margin:0;padding-left:20px}ol li{margin:0 0 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 10px;cursor:pointer;background:var(--blue-s);color:var(--blue)}
button.main{grid-column:1/-1;background:var(--blue);color:#fff;font-size:17px;padding:16px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 24px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.empty{text-align:center;padding:40px 16px}
@media print{body{background:#fff}.btns,#msgcard,.note button,#toast{display:none}.card{break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var A = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_.";

    return;

  var v = (p[3] || "").split(","), M = { gw: n(v[0]), ping: n(v[1]), jit: n(v[2]), loss: n(v[3]), dns: n(v[4]), down: n(v[5]), up: n(v[6]), cpu: n(v[7]), mem: n(v[8]), wifi: n(v[9]), outages: n(v[10]), cable: v[11] === "c" };

  var means = [

    "Your home network is fine - the trouble starts at your internet provider.",

  h += '<div class="card"><div class="btns"><button class="main" id="isp">Send to my internet provider</button><button id="share">Share</button><button id="pdf">Save as PDF</button><button id="copyall">Copy everything</button><button id="ai">Copy for AI</button></div></div>';

  function v2(h) {
    var D = function (x) { try { return decodeURIComponent((x || "").replace(/\+/g, " ")); } catch (e) { return x || ""; } };

        var mid = fr === to ? X(fr) + 60 : (X(fr) + X(to)) / 2, anc = fr === to ? "start" : "middle";
        svg += '<text x="' + mid + '" y="' + (y - 7) + '" font-size="13" text-anchor="' + anc + '" fill="var(--ink)">' + (sealed ? "🔒 " : "") + esc(lab) + '</text>';
        if (det) svg += '<text x="' + mid + '" y="' + (y + 16) + '" font-size="11" text-anchor="' + anc + '" fill="var(--muted)">' + esc(det.length > 70 ? det.slice(0, 69) + "…" : det) + '</text>';
        if (ms) svg += '<text x="' + (W - 2) + '" y="' + (y + 4) + '" font-size="12" font-weight="700" text-anchor="end" fill="var(--sub)">' + esc(ms) + ' ms</text>';

      var H2 = 10 + L.length * 52;
