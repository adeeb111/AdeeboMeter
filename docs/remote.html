<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>AdeeboMeter Remote</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Phone remote. The room and the secret arrive after the # - browsers never send that part to the server.
     Nothing is saved on this phone: no cookies, no storage, nothing kept once you close the page.
     Crypto (matches src/Remote/RemoteCrypto.cs): ECDH P-256 -> HKDF-SHA256 (salt = QR secret) -> AES-256-CBC + HMAC-SHA256 per direction, counters. -->
<style>
:root{--blue:#1F6FEB;--blue-s:#E8F0FE;--green:#2DA44E;--green-s:#E6F4EA;--amber:#BF8700;--amber-s:#FFF4D6;--red:#CF222E;--red-s:#FDE7E9;--purple:#8250DF;--ink:#1B2330;--sub:#4A5568;--muted:#6B7685;--line:#E3E8EF;--bg:#F6F8FB;--card:#fff;--grey-s:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--blue-s:#16233A;--green-s:#132A1B;--amber-s:#2E2410;--red-s:#3A1519;--ink:#E6EAF0;--sub:#B4BDC9;--muted:#8A94A3;--line:#2A3340;--bg:#0E131A;--card:#161C25;--grey-s:#1F2630}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 12px}.brand img{width:22px;height:22px}.brand small{font-weight:400;color:var(--muted);margin-left:auto;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.verdict{border-left:6px solid var(--c,var(--muted))}.verdict h1{font-size:20px;line-height:1.3;margin:4px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--s,var(--grey-s));color:var(--c,var(--muted))}
.l0{--c:var(--green);--s:var(--green-s)}.l1{--c:var(--amber);--s:var(--amber-s)}.l2{--c:var(--red);--s:var(--red-s)}.l3{--c:var(--muted);--s:var(--grey-s)}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.num{background:var(--s,var(--grey-s));border-radius:12px;padding:10px 12px}
.num .k{font-size:12px;color:var(--sub)}.num .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.num .v small{font-size:13px;font-weight:600;color:var(--sub)}
svg{display:block;width:100%;height:auto}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 10px;cursor:pointer;background:var(--blue-s);color:var(--blue)}
button.main{background:var(--blue);color:#fff}button:disabled{opacity:.5}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;color:var(--muted);padding:10px 4px;font-size:14px}.tabs button.on{color:var(--blue)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{text-align:left;font-size:14px;padding:12px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:0 0 10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));margin-top:7px;flex:none}.row b{display:block;font-size:14px}.row span{color:var(--sub);font-size:14px}.row em{display:block;color:var(--ink);font-style:normal;font-size:13px;margin-top:2px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 16px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.hide{display:none}
</style>
</head>
<body>
<main id="app"><div class="brand"><img src="favicon.svg" alt="">AdeeboMeter<small id="left"></small></div><div class="card" id="st"><h1 style="font-size:20px;margin:0">Connecting...</h1></div></main>
<nav class="tabs hide" id="tabs"><button data-v="live" class="on">Live</button><button data-v="game">Game</button><button data-v="stream">Stream</button><button data-v="trade">Trading</button><button data-v="tools">Checks</button></nav>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  // the relay's address - set when it's deployed (tools/remote). The PC uses the same one (src/Remote/Remote.cs).
  var RELAY = "";
  var subtle = window.crypto && window.crypto.subtle, te = new TextEncoder(), td = new TextDecoder();
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var e = $("toast"); e.textContent = t; e.className = "on"; clearTimeout(toast.h); toast.h = setTimeout(function () { e.className = ""; }, 2200); }
  function fail(head, more) { $("tabs").className = "tabs hide"; $("app").innerHTML = '<div class="brand"><img src="favicon.svg" alt="">AdeeboMeter</div><div class="card verdict l3"><h1>' + esc(head) + '</h1><p style="color:var(--sub);margin:8px 0 0">' + esc(more || "") + '</p></div>'; }
  function b64u(b) { var s = ""; b = new Uint8Array(b); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var r = atob(s), b = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) b[i] = r.charCodeAt(i); return b; }
  function cat() { var n = 0, i; for (i = 0; i < arguments.length; i++) n += arguments[i].length; var o = new Uint8Array(n), p = 0; for (i = 0; i < arguments.length; i++) { o.set(arguments[i], p); p += arguments[i].length; } return o; }
  function same(a, b) { if (a.length !== b.length) return false; var d = 0; for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }
  async function hmac(key, data) { var k = await subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]); return new Uint8Array(await subtle.sign("HMAC", k, data)); }
  async function hkdf(salt, ikm, info, len) { var k = await subtle.importKey("raw", ikm, "HKDF", false, ["deriveBits"]); return new Uint8Array(await subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: salt, info: te.encode(info) }, k, len * 8)); }
  function be(n) { var b = new Uint8Array(8); for (var i = 7; i >= 0; i--) { b[i] = n % 256; n = Math.floor(n / 256); } return b; }
  async function lane(secret, z, dir) {
    var k = await hkdf(secret, z, "adeebometer remote v1 " + (dir === 1 ? "pc>phone" : "phone>pc"), 64);
    var ek = await subtle.importKey("raw", k.slice(0, 32), "AES-CBC", false, ["encrypt", "decrypt"]), mk = k.slice(32), seq = 0;
    return {
      seal: async function (text) { var sq = be(++seq), iv = crypto.getRandomValues(new Uint8Array(16)); var ct = new Uint8Array(await subtle.encrypt({ name: "AES-CBC", iv: iv }, ek, te.encode(text))); var tag = await hmac(mk, cat(new Uint8Array([dir]), sq, iv, ct)); return b64u(cat(sq, iv, ct, tag)); },
      open: async function (f) {
        var b; try { b = unb64u(f); } catch (e) { return null; } if (b.length < 72 || (b.length - 56) % 16) return null;
        var sq = b.slice(0, 8), iv = b.slice(8, 24), ct = b.slice(24, b.length - 32), tag = b.slice(b.length - 32);
        if (!same(tag, await hmac(mk, cat(new Uint8Array([dir]), sq, iv, ct)))) return null;
        var n = 0; for (var i = 0; i < 8; i++) n = n * 256 + sq[i]; if (n <= seq) return null; seq = n;
        try { return td.decode(await subtle.decrypt({ name: "AES-CBC", iv: iv }, ek, ct)); } catch (e) { return null; }
      }
    };
  }

  // ---- the link: #room.secret
  var h = (location.hash || "").replace(/^#/, "").split(".");
  history.replaceState(null, "", location.pathname);   // the secret leaves the address bar (and the history entry) right away
  if (h.length !== 2 || !/^[A-Za-z0-9_-]{22}$/.test(h[0]) || !/^[A-Za-z0-9_-]{43}$/.test(h[1])) { fail("Scan the code on your PC", "Open AdeeboMeter, right-click its tray icon and choose Phone remote. Then scan the code it shows."); return; }
  if (!subtle || !window.WebSocket) { fail("This browser can't do the encryption", "Open the link in Safari or Chrome."); return; }
  if (!RELAY) { fail("The phone relay isn't set up yet", "This build of AdeeboMeter doesn't have a relay address."); return; }
  var room = h[0], secret = unb64u(h[1]), ws, tx, rx, view = "live", live = null, results = [], busy = "";

  async function start() {
    var auth = await hkdf(secret, te.encode("pair"), "adeebometer remote v1 auth", 32);
    var kp = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    var pk = new Uint8Array(await subtle.exportKey("raw", kp.publicKey));
    ws = new WebSocket(RELAY.replace(/^http/, "ws") + "/room/" + room + "?role=phone");
    ws.onopen = async function () {
      st("Waiting for you to press Allow on the PC", "A question just opened on your PC. Nothing is shared until you allow it.");
      var dev = /iPhone/.test(navigator.userAgent) ? "iPhone" : /iPad/.test(navigator.userAgent) ? "iPad" : /Android/.test(navigator.userAgent) ? "Android phone" : "A browser";
      ws.send(JSON.stringify({ t: "hi", pk: b64u(pk), dev: dev, mac: b64u(await hmac(auth, cat(te.encode("hi"), pk))) }));
    };
    ws.onclose = function () { if (tx) fail("Session over", "The PC ended it, 30 minutes passed, or the connection dropped. Scan a new code on the PC to start again."); else fail("Couldn't connect", "The code may have expired (2 minutes) or another phone is already connected. Make a new one on the PC."); tx = rx = null; };
    ws.onmessage = async function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!tx) {
        if (m.t === "no") { fail("Not allowed", "The PC said no."); ws.close(); return; }
        if (m.t !== "ok") return;
        var pcPk = unb64u(m.pk || "");
        if (pcPk.length !== 65 || !same(unb64u(m.mac || ""), await hmac(auth, cat(te.encode("ok"), pk, pcPk)))) { fail("This isn't your PC", "The answer wasn't signed with the code you scanned. Nothing was shared."); ws.close(); return; }
        var pcKey = await subtle.importKey("raw", pcPk, { name: "ECDH", namedCurve: "P-256" }, false, []);
        var z = new Uint8Array(await subtle.digest("SHA-256", await subtle.deriveBits({ name: "ECDH", public: pcKey }, kp.privateKey, 256)));
        tx = await lane(secret, z, 2); rx = await lane(secret, z, 1);
        $("tabs").className = "tabs"; draw(); return;
      }
      var plain = m.s ? await rx.open(m.s) : null;
      if (plain === null) { fail("Session closed to be safe", "A message didn't check out."); ws.close(); return; }
      var c; try { c = JSON.parse(plain); } catch (e) { return; }
      if (c.t === "live") { live = c; if (view !== "tools") draw(); else left(); }
      else if (c.t === "result") { busy = ""; results.unshift(c); results = results.slice(0, 5); view = "tools"; tabsOn(); draw(); }
      else if (c.t === "note" || c.t === "err") toast(c.msg || "");
      else if (c.t === "bye") ws.close();
    };
  }
  async function send(o) { if (!tx || ws.readyState !== 1) return; ws.send(JSON.stringify({ s: await tx.seal(JSON.stringify(o)) })); }
  function st(head, more) { $("app").innerHTML = '<div class="brand"><img src="favicon.svg" alt="">AdeeboMeter<small id="left"></small></div><div class="card verdict l3"><h1>' + esc(head) + '</h1><p style="color:var(--sub);margin:8px 0 0">' + esc(more) + '</p></div>'; }

  // ---- drawing
  function ms(v, u) { return v == null ? "–" : (Math.round(v * 10) / 10) + '<small> ' + (u || "ms") + '</small>'; }
  function mb(v) { return v == null ? "–" : (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + '<small> Mb/s</small>'; }
  function lvOf(v, ok, bad) { return v == null ? 3 : v >= bad ? 2 : v >= ok ? 1 : 0; }
  function num(k, v, lv) { return '<div class="num l' + lv + '"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div></div>'; }
  function left() { var e = $("left"); if (e && live && live.left != null) { var s = Math.max(0, Math.round(live.left)); e.textContent = "🔒 " + Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2) + " left"; } }
  function spark(h) {
    var v = (h || []).filter(function (x) { return x != null; }); if (v.length < 2) return "";
    var mx = Math.max.apply(null, v.concat([20])) * 1.15, W = 600, H = 90, pts = (h || []).map(function (x, i) { return x == null ? null : (i * W / Math.max(1, h.length - 1)).toFixed(1) + "," + (H - x / mx * H).toFixed(1); });
    var d = "", pen = false; pts.forEach(function (p) { if (!p) { pen = false; return; } d += (pen ? "L" : "M") + p; pen = true; });
    return '<svg viewBox="0 0 ' + W + ' ' + (H + 4) + '"><path d="' + d + '" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round"/></svg>';
  }
  function draw() {
    var a = '<div class="brand"><img src="favicon.svg" alt="">AdeeboMeter<small id="left"></small></div>', L = live;
    if (view === "live") {
      if (!L) a += '<div class="card"><h2>LIVE</h2>Waiting for the first reading...</div>';
      else {
        a += '<div class="card verdict l' + (L.lv >= 0 && L.lv <= 2 ? L.lv : 3) + '"><span class="tag">' + esc(L.chip || "") + '</span><h1>' + esc(L.head || "") + '</h1></div>';
        a += '<div class="card"><h2>RIGHT NOW</h2><div class="grid">' + num("Download", mb(L.down), 3) + num("Upload", mb(L.up), 3) + num("Ping (internet)", ms(L.ping), lvOf(L.ping, 80, 200)) + num("Router", ms(L.gw), lvOf(L.gw, 20, 80)) +
          num("Jitter", ms(L.jit), lvOf(L.jit, 20, 50)) + num("Loss", L.loss == null ? "–" : Math.round(L.loss * 10) / 10 + "<small> %</small>", lvOf(L.loss, 1, 3)) + num("CPU", L.cpu == null ? "–" : Math.round(L.cpu) + "<small> %</small>", lvOf(L.cpu, 80, 95)) + num("Memory", L.mem == null ? "–" : Math.round(L.mem) + "<small> %</small>", lvOf(L.mem, 85, 95)) + '</div>' +
          '<p style="font-size:13px;color:var(--muted);margin:10px 0 0">On ' + esc(L.link || "the network") + '. Updates every second.</p></div>';
        a += '<div class="card"><h2>QUICK</h2><div class="tools"><button data-run="speedtest">Speed test</button><button data-run="checkup">Full checkup</button><button data-run="feltslow">It feels slow</button><button data-mute="60">Mute alerts 1 h</button></div></div>';
      }
    } else if (view === "game") {
      var g = L && L.game;
      if (!g) a += '<div class="card verdict l3"><h1>No game being watched</h1><p style="color:var(--sub);margin:8px 0 0">Pick your games in Gamer on the PC - their server pings show up here while you play.</p></div>';
      else {
        var glv = g.grade === "Competitive" ? 0 : g.grade === "Casual" ? 1 : g.grade === "Laggy" ? 2 : 3;
        a += '<div class="card verdict l' + glv + '"><span class="tag">' + esc(g.grade) + '</span><h1>' + esc(g.name) + ' · ' + esc(g.srv) + '</h1><p style="color:var(--sub);margin:6px 0 0">' + (g.on === "1" ? "Playing now" : "Watching, not playing") + '</p></div>';
        a += '<div class="card"><h2>SERVER PING</h2><div class="grid">' + num("Now", ms(g.now), lvOf(g.now, 60, 120)) + num("Average", ms(g.avg), lvOf(g.avg, 60, 120)) + num("Jitter", ms(g.jit), lvOf(g.jit, 10, 25)) + num("Loss", g.loss == null ? "–" : Math.round(g.loss * 10) / 10 + "<small> %</small>", lvOf(g.loss, 1, 3)) + '</div>' + spark(g.hist) + '<p style="font-size:13px;color:var(--muted);margin:8px 0 0">Last minute, one dot a second.</p></div>';
        a += '<div class="card"><h2>LAG RIGHT NOW?</h2><div class="tools"><button data-run="gamecompare">Compare game servers</button><button data-run="bloat">Lag under load</button></div></div>';
      }
    } else if (view === "stream") {
      var sm = L && L.stream;
      if (!sm || sm.on !== "1") a += '<div class="card verdict l3"><h1>Nothing playing on the PC right now</h1><p style="color:var(--sub);margin:8px 0 0">When a stream plays - or you go live - its numbers show here.</p></div>';
      else a += '<div class="card verdict l' + (sm.dips > 3 ? 2 : sm.dips > 0 ? 1 : 0) + '"><span class="tag">' + (sm.dips === 0 ? "SMOOTH SO FAR" : sm.dips + (sm.dips === 1 ? " DROP" : " DROPS")) + '</span><h1>' + esc(sm.what) + '</h1>' + (sm.last ? '<p style="color:var(--sub);margin:6px 0 0">Last drop ' + esc(sm.last) + '</p>' : '') + '</div>' +
        '<div class="card"><h2>THE STREAM</h2><div class="grid">' + num("Coming in", mb(sm.down), 3) + num("Its server", ms(sm.far), lvOf(sm.far, 80, 200)) + num("Playing for", sm.mins == null ? "–" : Math.round(sm.mins) + "<small> min</small>", 3) + num("Router", ms(L.gw), lvOf(L.gw, 20, 80)) + '</div></div>';
      a += '<div class="card"><h2>GOING LIVE</h2><div class="grid">' + num("Upload now", mb(L && L.up), 3) + num("Ping", ms(L && L.ping), lvOf(L && L.ping, 80, 200)) + num("Jitter", ms(L && L.jit), lvOf(L && L.jit, 20, 50)) + num("Loss", L && L.loss != null ? Math.round(L.loss * 10) / 10 + "<small> %</small>" : "–", lvOf(L && L.loss, 1, 3)) + '</div>' +
        '<div class="tools" style="margin-top:10px"><button data-run="golive">Ready to stream?</button><button data-run="speedtest">Speed test</button></div><p style="font-size:13px;color:var(--muted);margin:8px 0 0">The check runs on the PC without opening anything over your stream.</p></div>';
    } else if (view === "trade") {
      var t = L && L.trade;
      if (!t) a += '<div class="card verdict l3"><h1>Trading isn\'t set up</h1><p style="color:var(--sub);margin:8px 0 0">Add your broker in Trading on the PC to see its delay here.</p></div>';
      else {
        a += '<div class="card verdict l' + (t.lv >= 0 && t.lv <= 2 ? t.lv : 3) + '"><span class="tag">' + esc(t.venue) + ' · ' + (t.open === "1" ? "OPEN" : "CLOSED") + '</span><h1>' + esc(t.head || "") + '</h1></div>';
        a += '<div class="card"><h2>THE WAY TO YOUR BROKER</h2><div class="grid">' + num("Router", ms(t.router), lvOf(t.router, 20, 80)) + num("Internet", ms(t.net), lvOf(t.net, 80, 200)) + num("Broker", ms(t.broker), lvOf(t.broker, 120, 300)) + '</div></div>';
        a += '<div class="card"><h2>CHECK</h2><div class="tools"><button data-run="marketopen">Market open check</button><button data-run="httptime" data-ask="Broker website">Broker site timing</button></div></div>';
      }
    } else {
      a += '<div class="card"><h2>RUN A CHECK ON THE PC</h2><input id="tgt" placeholder="Site or address (for checks that need one)" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="tools">' +
        [["speedtest", "Speed test"], ["checkup", "Full checkup"], ["ping", "Ping"], ["tcpping", "TCP ping"], ["bloat", "Lag under load"], ["mtu", "MTU per hop"], ["mtr", "Loss per hop (1 min)"], ["route", "Which route"], ["port", "Is a port open"], ["http", "Website check"], ["httptime", "Website timing"], ["doh", "DNS check"], ["gateway", "Gateway"], ["ip46", "IPv4 vs IPv6"], ["clock", "Clock check"], ["teams", "Teams / calls"]]
          .map(function (x) { return '<button data-run="' + x[0] + '"' + (busy ? " disabled" : "") + '>' + esc(x[1]) + '</button>'; }).join("") + '</div>' + (busy ? '<p style="margin:10px 0 0;color:var(--sub)">Running ' + esc(busy) + ' on the PC...</p>' : '') + '</div>';
      results.forEach(function (r) {
        var worst = (r.rows || []).reduce(function (m, o) { var l = +o[0]; return l >= 0 && l <= 2 ? Math.max(m, l) : m; }, -1);
        a += '<div class="card verdict l' + (worst < 0 ? 3 : worst) + '"><span class="tag">' + (worst === 2 ? "PROBLEM FOUND" : worst === 1 ? "WORTH A LOOK" : worst === 0 ? "LOOKS GOOD" : "RESULT") + '</span><h1>' + esc(r.title) + '</h1><div style="margin-top:10px">' +
          (r.rows || []).map(function (o) { var l = +o[0]; if (l === -1) return '<h2 style="margin:14px 0 4px">' + esc(String(o[1]).toUpperCase()) + '</h2>'; if (l > 3) return '<div class="row"><span style="font-family:ui-monospace,monospace;font-size:12px">' + esc(o[2]) + '</span></div>'; return '<div class="row l' + (l >= 0 && l <= 2 ? l : 3) + '"><i></i><div><b>' + esc(o[1]) + '</b><span>' + esc(o[2]) + '</span>' + (o[3] && l >= 1 && l <= 2 ? '<em>' + esc(o[3]) + '</em>' : '') + '</div></div>'; }).join("") + '</div></div>';
      });
    }
    a += '<p class="note">🔒 Encrypted end to end with the code you scanned. Nothing is saved on this phone or on the relay. <button id="bye" style="padding:4px 10px;font-size:12px">End session</button></p>';
    $("app").innerHTML = a; left();
  }
  function tabsOn() { [].forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.className = b.getAttribute("data-v") === view ? "on" : ""; }); }
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; view = b.getAttribute("data-v"); tabsOn(); draw(); });
  $("app").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
